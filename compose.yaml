services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_VERSION: "compose-1.0"
      REDIS_HOST: redis
    depends_on:
      - redis
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
volumes:
  redis-data:
