apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudlab
  template:
    metadata:
      labels:
        app: cloudlab
    spec:
      containers:
        - name: cloudlab
          image: DOCKERHUB_FELHASZNALO/cloudlab:1.0
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "k8s-1.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloudlab
spec:
  selector:
    app: cloudlab
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
